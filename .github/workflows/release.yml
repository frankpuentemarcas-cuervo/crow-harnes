name: Crow release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: remote/go.mod
          cache-dependency-path: remote/go.sum

      - name: Test remote service
        working-directory: remote
        run: go test ./...

      - name: Test one-command installer
        run: bash remote/install_test.sh

      - name: Package Linux service
        shell: bash
        run: |
          mkdir -p linux-dist
          for arch in amd64 arm64; do
            (cd remote && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "../linux-dist/crowd-linux-$arch" ./cmd/crowd)
            (cd linux-dist && sha256sum "crowd-linux-$arch" > "crowd-linux-$arch.sha256")
          done

      - name: Store Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: crowd-linux
          path: linux-dist/*
          if-no-files-found: error

  android:
    permissions:
      contents: read
    uses: ./.github/workflows/android-validation.yml

  release:
    needs: [linux, android]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test desktop alert and terminal logic
        run: npm test

      - name: Test terminal clipboard in isolated Electron
        run: node tests/terminal-clipboard-electron.mjs

      - name: Test automatic alert audio in isolated Electron
        run: node tests/notice-audio-electron.mjs

      - name: Test Free LLM startup after SSH unlock in isolated Electron
        run: node tests/free-llm-startup-electron.mjs

      - name: Type-check sources
        run: npm run typecheck

      - name: Ensure tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag $env:GITHUB_REF_NAME must match package version v$packageVersion"
          }

      - name: Build Windows installer
        run: npm run package:win

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: crowd-linux
          path: dist

      - name: Download Android test APK
        uses: actions/download-artifact@v4
        with:
          name: crow-android
          path: dist

      - name: Publish and verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "dist/Crow-Harness-Setup-$version-x64.exe"
          $blockmap = "$installer.blockmap"
          $metadata = 'dist/latest.yml'
          $linux = @('amd64', 'arm64') | ForEach-Object { "dist/crowd-linux-$_" }
          $checksums = $linux | ForEach-Object { "$_.sha256" }
          $androidVersion = (Get-Content packages/android-companion/package.json | ConvertFrom-Json).version
          $apk = "dist/Crow-Companion-$androidVersion-debug.apk"
          $apkChecksum = "$apk.sha256"
          $files = @($installer, $blockmap, $metadata, $apk, $apkChecksum) + $linux + $checksums
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing release asset: $file" }
          }
          foreach ($file in $linux) {
            $expected = ((Get-Content -LiteralPath "$file.sha256" -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "Linux checksum mismatch: $file" }
          }
          $apkName = Split-Path $apk -Leaf
          $apkSum = (Get-Content -LiteralPath $apkChecksum -Raw).Trim()
          if ($apkSum -notmatch "^([a-fA-F0-9]{64})\s+\*?$([regex]::Escape($apkName))$") {
            throw 'Android checksum file has an invalid hash or filename'
          }
          $expectedApkHash = $Matches[1]
          $actualApkHash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash
          if ($expectedApkHash -ne $actualApkHash) { throw 'Android APK checksum mismatch' }
          if (-not ((Get-Content -LiteralPath $metadata -Raw) -match "(?m)^version: $version\r?`$")) {
            throw 'latest.yml does not match the release version'
          }

          $androidNotes = @"
          ## Android companion: APK debug de prueba

          - Asset: ``$apkName`` y su suma SHA-256; versión Android $androidVersion.
          - APK debug para evaluación, NO una versión de producción ni de Google Play.
          - Firma debug efímera de CI: una compilación futura puede exigir desinstalar/reinstalar, perdiendo vínculos locales y requiriendo emparejar otra vez.
          - Requiere Crow abierto en Windows, acceso individual habilitado y permisos explícitos por dispositivo/proyecto.
          - Compilación y pruebas automatizadas NO validan funcionamiento LAN/remoto en un teléfono real; quedan pendientes IME, TLS, Keystore, cámara y pruebas de dispositivo.
          "@
          $existingRelease = gh release view $env:GITHUB_REF_NAME --json id,body 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingNotes = ($existingRelease | ConvertFrom-Json).body
            if ($existingNotes -notmatch '(?m)^## Android companion: APK debug de prueba\r?$') {
              $notesPath = 'dist/release-notes.md'
              "$androidNotes`n`n$existingNotes" | Set-Content -LiteralPath $notesPath -Encoding utf8
              gh release edit $env:GITHUB_REF_NAME --notes-file $notesPath
              if ($LASTEXITCODE -ne 0) { throw 'Could not add Android release safety notes' }
            }
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --title $version --notes $androidNotes --generate-notes --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed' }

          $assets = (gh release view $env:GITHUB_REF_NAME --json assets | ConvertFrom-Json).assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release assets' }
          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $asset = $assets | Where-Object name -eq $name | Select-Object -First 1
            if (-not $asset -or $asset.state -ne 'uploaded' -or $asset.size -ne (Get-Item -LiteralPath $file).Length) {
              throw "Release asset missing or wrong size: $name"
            }
          }
